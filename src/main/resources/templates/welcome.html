<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="card welcome-card">
    <div class="card-body">

        <!-- First letter of the username as a simple avatar -->
        <div class="welcome-avatar" th:text="${#strings.substring(username, 0, 1)}">A</div>

        <h2 class="welcome-name">
            Welcome <span th:text="${username}">Akash</span>
        </h2>
        <p class="text-muted mb-4">You're signed in to your account.</p>

        <a th:href="@{/logout}" class="btn btn-outline-danger px-4 rounded-3">Logout</a>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
