<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="card auth-card">
    <div class="card-body">

        <div class="brand-icon">&#128274;</div>
        <h4 class="auth-title text-center">Welcome back</h4>
        <p class="auth-subtitle text-center">Sign in to continue</p>

        <!-- Flash message shown after a successful registration -->
        <div th:if="${registerSuccess}" class="alert alert-success py-2" th:text="${registerSuccess}">
            Account created.
        </div>

        <!-- Shown when the username/password combination doesn't match -->
        <div th:if="${loginError}" class="alert alert-danger py-2" th:text="${loginError}">
            Invalid credentials.
        </div>

        <form th:action="@{/login}" th:object="${loginForm}" method="post" novalidate>

            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <input type="text" id="username" class="form-control"
                       th:field="*{username}"
                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                       placeholder="Enter your username">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">
                    Username error
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" id="password" class="form-control"
                       th:field="*{password}"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                       placeholder="Enter your password">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                    Password error
                </div>
            </div>

            <button type="submit" class="btn btn-gradient w-100 rounded-3">Login</button>
        </form>

        <p class="auth-footer-link text-center mt-4 mb-0">
            Don't have an account? <a th:href="@{/register}">Register here</a>
        </p>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
