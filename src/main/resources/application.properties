# ============================================================================
# Application / Tomcat
# ============================================================================
spring.application.name=user-login-app
server.port=${SERVER_PORT:8080}

# ============================================================================
# MySQL on AWS RDS
# Set DB_HOST to your RDS endpoint, e.g.
#   myapp-db.abcd1234.us-east-1.rds.amazonaws.com
# Defaults fall back to a local MySQL so you can develop without RDS.
# ============================================================================
spring.datasource.url=jdbc:mysql://user-login-db.c2r8o6gy4trz.us-east-1.rds.amazonaws.com:3306/user_login_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=admin
spring.datasource.password=akash2018

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================================
# JPA / Hibernate
# `update` creates the users table automatically on first run. If you'd rather
# control the schema yourself, run sql/schema.sql and set this to `validate`.
# ============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ============================================================================
# Thymeleaf
# ============================================================================
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.encoding=UTF-8

# ============================================================================
# Session
# ============================================================================
server.servlet.session.timeout=30m

# ============================================================================
# Logging
# ============================================================================
logging.level.root=INFO
logging.level.com.loginapp=DEBUG
